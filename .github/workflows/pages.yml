name: Publicar API (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["api/**", "data/**", "site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Garantir que os dados e a API estão correctos
        run: |
          python3 scripts/validate.py
          python3 scripts/build.py --check
          python3 -m unittest discover -s tests
      - name: Preparar site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp -r api _site/api
          cp -r data _site/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
